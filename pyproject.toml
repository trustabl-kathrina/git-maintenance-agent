[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "git-maintenance-agent"
version = "0.1.0"
description = "A safe, skill-driven CLI agent for investigating Python repository failures."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ebere" }]
keywords = ["agent", "openai", "pytest", "maintenance", "skills", "git"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "openai-agents>=0.14",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "rich>=13.9",
  "typer>=0.15",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[project.scripts]
gma = "git_maintenance_agent.cli:app"

[project.urls]
Homepage = "https://github.com/ebere/git-maintenance-agent"
Repository = "https://github.com/ebere/git-maintenance-agent"
Issues = "https://github.com/ebere/git-maintenance-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/git_maintenance_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "evals", "docs", "README.md", "LICENSE", "CONTRIBUTING.md"]

[tool.hatch.build]
artifacts = ["src/git_maintenance_agent/skills/**"]
exclude = [".uv-cache", ".venv", ".pytest-tmp", ".pytest_cache", "dist", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".venv", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["evals"]
